[package]
name = "rbxsoap"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "A lightweight rust library for communicating with RCCService (Roblox Cloud Compute Service)"
authors = ["worships <realwalnut@proton.me>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }